spring.application.name=crave-restaurant
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crave_restaurant?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Local learning secret only. Set JWT_SECRET for any shared deployment (at least 32 characters).
app.jwt.secret=${JWT_SECRET:crave-local-development-secret-key-1234567890}
# Easy H2 fallback: comment out the three datasource lines above and uncomment these:
# spring.datasource.url=jdbc:h2:file:./data/crave
# spring.datasource.username=sa
# spring.datasource.password=
# Or run: mvn spring-boot:run -Dspring-boot.run.profiles=h2
